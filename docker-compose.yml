services:
  warehouse:
    image: postgres:16
    container_name: olist_warehouse
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_pass
      POSTGRES_DB: olist
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_user -d olist"]
      interval: 5s
      retries: 10

  airflow:
    build: ./airflow
    container_name: olist_airflow
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/project/ingestion
      - ./olist_dbt:/opt/airflow/project/olist_dbt
      - ./data:/opt/airflow/project/data
    command: standalone

  metabase:
    image: metabase/metabase:latest
    container_name: olist_metabase
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data

volumes:
  warehouse_data:
  metabase_data: